<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101d"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Rounded Rect Obsidian Card -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>
  
  <!-- Subtle Trading Grid Lines -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" opacity="0.6"/>
  <line x1="8" y1="46" x2="56" y2="46" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" opacity="0.4"/>
  <line x1="32" y1="8" x2="32" y2="56" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3" opacity="0.4"/>
  
  <!-- Candlestick Bar Accent -->
  <line x1="22" y1="28" x2="22" y2="44" stroke="#0284c7" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="36" y1="22" x2="36" y2="38" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  
  <!-- Ascending Quant Flow Wave Glow -->
  <path d="M12 48 L24 38 L36 32 L44 36 L52 16" fill="none" stroke="#38bdf8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.25" filter="url(#glow)"/>
  
  <!-- Ascending Quant Flow Wave Core -->
  <path d="M12 48 L24 38 L36 32 L44 36 L52 16" fill="none" stroke="url(#lineGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Peak Emerald Breakthrough Pulse Node -->
  <circle cx="52" cy="16" r="6" fill="#10b981" opacity="0.35"/>
  <circle cx="52" cy="16" r="4.2" fill="#10b981" stroke="#34d399" stroke-width="1"/>
  <circle cx="52" cy="16" r="2" fill="#ffffff"/>
  
  <!-- Origin Node -->
  <circle cx="12" cy="48" r="2.2" fill="#0284c7"/>
</svg>